# Práctica 2 — Configuración de NEAT-Python 2.0.
# Punto de partida: el archivo de las indicaciones técnicas (apartado 3).
# Cambios: num_inputs = 6 (observación de C2/C3 con Δs); población,
# especiación y elitismo; pesos iniciales y mutaciones más pequeños.
# La semilla la sustituye evolucionar.py por la de --semilla en la copia que
# guarda en la carpeta de cada evolución.

[NEAT]
fitness_criterion      = max
fitness_threshold      = 1000.0
no_fitness_termination = True
pop_size               = 20
reset_on_extinction    = True
seed = 6

[DefaultGenome]
# visible, x, tamaño, v anterior, w anterior, Δs  ->  v, w
num_inputs         = 6
num_hidden         = 0
num_outputs        = 2
feed_forward       = True
initial_connection = full_direct

# tanh: salidas en [-1, 1], el rango de la acción del entorno
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# Mutaciones suaves (tasa 0,3, fuerza 0,1, reemplazo 0,02): en c1_s1 el
# único seguidor (id 7) era frágil y ningún hijo suyo conservaba el
# comportamiento. Con tasa 0,8 y fuerza 0,5 las copias mutadas del id 7
# cambiaban su acción en 0,32 de media (en [-1, 1]); así, 0,11.
# Pesos y bias iniciales pequeños: tanh(2,5 z) se saturaba con 1,0 (el 83 %
# de las redes iniciales giraba al máximo con la pelota centrada y en c1_s1,
# a la generación 15, ninguna reaccionaba a x)
bias_init_mean     = 0.0
bias_init_stdev    = 0.1
bias_max_value     = 5.0
bias_min_value     = -5.0
bias_mutate_power  = 0.1
bias_mutate_rate   = 0.3
bias_replace_rate  = 0.02

response_init_mean    = 1.0
response_init_stdev   = 0.0
response_max_value    = 5.0
response_min_value    = -5.0
response_mutate_power = 0.0
response_mutate_rate  = 0.0
response_replace_rate = 0.0

weight_init_mean    = 0.0
weight_init_stdev   = 0.3
weight_max_value    = 5.0
weight_min_value    = -5.0
weight_mutate_power = 0.1
weight_mutate_rate  = 0.3
weight_replace_rate = 0.02

enabled_default     = True
enabled_mutate_rate = 0.01

conn_add_prob    = 0.3
conn_delete_prob = 0.1
node_add_prob    = 0.1
node_delete_prob = 0.05

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
# 3.0 dejaba una sola especie (distancia genética media 1,0–1,4);
# 1.3 daba 4–8 especies de 2–5 individuos; 2.0 daba 2–4 especies. Con los
# pesos iniciales de 0,3 la distancia media bajó a 0,3–0,5 y 2.0 dejaba una
# sola especie (c1_s1): se escala al mismo orden
compatibility_threshold = 0.8

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 8
species_elitism      = 1

[DefaultReproduction]
# elitismo POR ESPECIE: con 2 y 7 especies, 14 de 20 individuos eran
# copias y sólo 6 hijos nuevos por generación
elitism            = 1
survival_threshold = 0.3
min_species_size   = 2
